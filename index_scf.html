async function _origFdFetch(u){
  // 先查缓存
  try{
    let cacheKey='fd_'+btoa(u).replace(/[^a-zA-Z0-9]/g,'').slice(0,80);
    let cached=localStorage.getItem(cacheKey);
    if(cached){
      let obj=JSON.parse(cached);
      let ttl=u.includes('matches')?180000:u.includes('standings')?900000:3600000;
      if(obj.t&&(Date.now()-obj.t<ttl))return obj.d;
    }
  }catch(e){}
  
  /* 优先走腾讯云函数（国内直连，无需代理） */
  try{
    let ep=u.replace('https://api.football-data.org/v4/','');
    let scfUrl=SCF_URL+'/football?endpoint='+encodeURIComponent(ep);
    let c=new AbortController;let t=setTimeout(function(){c.abort()},12000);

    if(r.ok){let json=await r.json();
      try{let cacheKey='fd_'+btoa(u).replace(/[^a-zA-Z0-9]/g,'').slice(0,80);localStorage.setItem(cacheKey,JSON.stringify({t:Date.now(),d:json}));}catch(e){}
      return json;
    }
  }catch(e){}
  
  // 降级：逐个尝试代理，每个最多重试2次
  for(let i=0;i<FD_PROXIES.length;i++){
    for(let retry=0;retry<=2;retry++){
      try{
        let c=new AbortController;
        let timeout=12000-retry*2000;
        let t=setTimeout(function(){c.abort()},timeout);
        let r=await fetch(FD_PROXIES[i]+encodeURIComponent(u),{headers:{'X-Auth-Token':FD_KEY},signal:c.signal});
        clearTimeout(t);
        if(r.ok){
          let json=await r.json();
          // 缓存到localStorage
          try{
            let cacheKey='fd_'+btoa(u).replace(/[^a-zA-Z0-9]/g,'').slice(0,80);
            localStorage.setItem(cacheKey,JSON.stringify({t:Date.now(),d:json}));
          }catch(e){}
          return json;
        }
      }catch(e){
        if(retry<2){
          // 指数退避等待
          await new Promise(r=>setTimeout(r,300*(retry+1)));
        }
      }
    }
  }
  return null;
}

          allTables.HOME.forEach(function(t){
            if(t.team.name===m.home_en||t.team.shortName===m.home_en||(m.home_en&&t.team.name.includes(m.home_en.slice(0,4))))homeStatHome=t;
          });
        }
        if(allTables.AWAY){
          allTables.AWAY.forEach(function(t){
            if(t.team.name===m.away_en||t.team.shortName===m.away_en||(m.away_en&&t.team.name.includes(m.away_en.slice(0,4))))awayStatAway=t;
          });
        }
        
        // 攻防数据对比
        if(homeStat||awayStat)updateAttackDefense('attack_defense',homeStat,awayStat,m.home,m.away);
        
        // 主客场数据对比
        updateHomeAwayStats(homeStatHome||homeStat, awayStatAway||awayStat, m.home, m.away);
        
        // 进球失球深度统计
        updateGoalStats(homeStat,awayStat,m.home,m.away,finalTable);
        
        // 零封率与防守效率（传入真实球队ID）
        updateCleanSheet(homeStat,awayStat,homeFixtures,awayFixtures,homeTeamId,awayTeamId,m.home,m.away);
        
        // 进攻火力排名
        updateAttackRank(homeStat,awayStat,finalTable,m.home,m.away);
        
        // 积分差距分析
        updatePointsGap(homeStat,awayStat,m.home,m.away);
        
        // 战意与排名分析
        updateMotivation(homeStat,awayStat,finalTable,m.home,m.away);
      }
      
      // 加载射手榜
      let scorers=await fdLeagueScorers(lc,5);
      updateScorers('league_scorers',scorers);
    }
    
    // 独立更新：积分差距、战意分析等（不依赖finalTable，世界杯模式也能正常显示）
    if(homeStat || awayStat){
      updatePointsGap(homeStat, awayStat, m.home, m.away);
      updateMotivation(homeStat, awayStat, finalTable || [], m.home, m.away);
      updateAttackRank(homeStat, awayStat, finalTable || [], m.home, m.away);
      updateAttackDefense('attack_defense', homeStat, awayStat, m.home, m.away);
      updateGoalStats(homeStat, awayStat, m.home, m.away, finalTable || []);
      updateCleanSheet(homeStat, awayStat, homeFixtures, awayFixtures, homeTeamId, awayTeamId, m.home, m.away);
    }else{
      // 没有数据时显示暂无数据，避免一直"正在分析"
      updatePointsGap(null, null, m.home, m.away);
      updateMotivation(null, null, [], m.home, m.away);
      updateAttackRank(null, null, [], m.home, m.away);
      updateAttackDefense('attack_defense', null, null, m.home, m.away);
      updateGoalStats(null, null, m.home, m.away, []);
      updateCleanSheet(null, null, [], [], null, null, m.home, m.away);
    }
    
    // 基于近五场数据的分析模块（传入真实球队ID）
    if(homeFixtures.length>0||awayFixtures.length>0){
      // 近期状态走势
      updateFormGuide(homeFixtures,awayFixtures,homeTeamId,awayTeamId,m.home,m.away);
      
      // 大小球预测
      updateOverUnder(homeStat,awayStat,homeFixtures,awayFixtures,homeTeamId,awayTeamId);
      
      // 半全场预测
      updateHalfFull(homeFixtures,awayFixtures,homeTeamId,awayTeamId);
    }
    
    // 亚洲让球推荐（基于赔率）
    updateAsianHandicap(m);
    
  }catch(e){console.log('加载真实数据失败',e)}
}

function calcKelly(odds,prob){
  // 凯利公式: f* = (bp - q) / b, b=赔率-1, p=胜率, q=1-p
  let b=odds-1;
  let p=prob/100;
  let q=1-p;
  let kelly=(b*p-q)/b;
  return Math.max(0,Math.min(1,kelly));
}
function updateKelly(m){
  let el=document.getElementById('kelly_result');
  if(!el||!m.odds.h||!m.odds.d||!m.odds.a){el.innerHTML='<div class="tc g">赔率数据不足</div>';return;}
  let th=1/m.odds.h,td=1/m.odds.d,ta=1/m.odds.a,tt=th+td+ta;
  let hp=th/tt*100,dp=td/tt*100,ap=ta/tt*100;
  let kh=calcKelly(m.odds.h,hp);
  let kd=calcKelly(m.odds.d,dp);
  let ka=calcKelly(m.odds.a,ap);
  let maxK=Math.max(kh,kd,ka);
  let suggest=maxK===kh?'主胜':maxK===kd?'平局':'客胜';
  let suggestColor=maxK===kh?'#10b981':maxK===kd?'#64748b':'#ef4444';
  let html='<div class="g2 mb3" style="gap:8px">';
  html+='<div class="bg1 rd pd2 tc"><div class="s2 g">主胜凯利</div><div class="b" style="color:#10b981">'+(kh*100).toFixed(1)+'%</div></div>';
  html+='<div class="bg3 rd pd2 tc"><div class="s2 g">平局凯利</div><div class="b">'+(kd*100).toFixed(1)+'%</div></div>';
  html+='<div class="bg2 rd pd2 tc"><div class="s2 g">客胜凯利</div><div class="b" style="color:#ef4444">'+(ka*100).toFixed(1)+'%</div></div>';
  html+='</div>';
  html+='<div class="tc" style="background:rgba(20,184,166,0.1);border-radius:8px;padding:10px;border:1px solid rgba(20,184,166,0.3)"><div class="s2 g">建议投注方向</div><div class="b" style="color:'+suggestColor+';font-size:16px">'+suggest+'</div><div class="s2 g mt1">建议投入资金比例: <b>'+(maxK*100).toFixed(0)+'%</b></div></div>';
  html+='<div class="s2 g mt2" style="text-align:center">※ 凯利公式基于真实赔率推导，仅供参考</div>';
  el.innerHTML=html;
}

function updateFormGuide(homeFixtures,awayFixtures,homeId,awayId,homeName,awayName){
  let el=document.getElementById('form_guide');
  if(!el)return;
  function calcForm(fixtures,teamId){
    if(!fixtures||fixtures.length===0||!teamId)return null;
    let w=0,d=0,l=0,gf=0,ga=0;
    fixtures.forEach(function(f){
      if(!f.score||!f.score.fullTime)return;
      let isHome=f.homeTeam.id===teamId;
      let hg=f.score.fullTime.home||0,ag=f.score.fullTime.away||0;
      gf+=isHome?hg:ag;
      ga+=isHome?ag:hg;
      if(hg===ag)d++;
      else if((isHome&&hg>ag)||(!isHome&&ag>hg))w++;
      else l++;
    });
    return{w:w,d:d,l:l,gf:gf,ga:ga,total:fixtures.length};
  }
  let hf=calcForm(homeFixtures,homeId);
  let af=calcForm(awayFixtures,awayId);
  if(!hf&&!af){el.innerHTML='<div class="t" style="color:#10b981">📈 近期状态走势</div><div class="bg3 rd pd2 tc s1"><span class="g">暂无数据</span></div>';return;}
  let html='<div class="t" style="color:#10b981">📈 近期状态走势</div><div class="g2 s1">';
  if(hf){
    html+='<div style="background:rgba(16,185,129,0.05);border-radius:10px;padding:10px"><div class="tc green b mb2">'+homeName+'</div>';
    html+='<div class="row bw py1"><span class="g">近'+hf.total+'场</span><span class="b">'+hf.w+'胜'+hf.d+'平'+hf.l+'负</span></div>';
    html+='<div class="row bw py1"><span class="g">进球/失球</span><span class="b">'+hf.gf+'/'+hf.ga+'</span></div>';
    let rate=((hf.w*3+hf.d)/(hf.total*3)*100).toFixed(0);
    html+='<div class="row bw py1"><span class="g">拿分率</span><span class="b green">'+rate+'%</span></div></div>';

function updateOverUnder(homeData,awayData,homeFixtures,awayFixtures,homeId,awayId){
  let el=document.getElementById('over_under');
  if(!el||!homeData||!awayData){el.innerHTML='<div class="t" style="color:#ec4899">🎯 大小球预测</div><div class="bg3 rd pd2 tc s1"><span class="g">暂无数据</span></div>';return;}
  let hp=homeData.playedGames||1,ap=awayData.playedGames||1;
  let hAvg=(homeData.goalsFor||0)/hp+(homeData.goalsAgainst||0)/hp;
  let aAvg=(awayData.goalsFor||0)/ap+(awayData.goalsAgainst||0)/ap;
  let expected=(hAvg+aAvg)/2;
  // 统计近期大球场次
  function countOver(fixtures,teamId){
    if(!fixtures||fixtures.length===0||!teamId)return null;
    let over=0,valid=0;
    fixtures.forEach(function(f){
      if(!f.score||!f.score.fullTime)return;
      let total=f.score.fullTime.home+f.score.fullTime.away;
      if(total>2.5)over++;
      valid++;
    });
    return valid>0?{over:over,total:valid}:null;
  }
  let hO=countOver(homeFixtures,homeId);
  let aO=countOver(awayFixtures,awayId);
  let overProb=Math.min(85,Math.max(15,expected/3*100));
  // 综合主客队近期大球率
  let recentOver=0,count=0;
  if(hO&&hO.total>0){recentOver+=hO.over/hO.total*100;count++;}
  if(aO&&aO.total>0){recentOver+=aO.over/aO.total*100;count++;}
  if(count>0)overProb=(overProb*0.6+recentOver/count*0.4);
  let underProb=100-overProb;
  let html='<div class="t" style="color:#ec4899">🎯 大小球预测 <span class="s2 g">(AI推演·基于真实攻防数据)</span></div><div class="bg3 rd pd2 s1">';
  html+='<div class="tc mb2" style="font-size:18px;font-weight:bold">预期进球: <span class="orange">'+expected.toFixed(2)+'</span> 球</div>';
  html+='<div class="row bw py1"><span>大2.5球概率</span><span class="b orange">'+overProb.toFixed(0)+'%</span></div>';
  html+='<div class="bar mb2"><div style="width:'+overProb+'%;background:#f97316"></div></div>';
  html+='<div class="row bw py1"><span>小2.5球概率</span><span class="b blue">'+underProb.toFixed(0)+'%</span></div>';
  html+='<div class="bar mb2"><div style="width:'+underProb+'%;background:#3b82f6"></div></div>';
  if(hO)html+='<div class="tc s2 g">主队近5场大球率: '+(hO.over/hO.total*100).toFixed(0)+'%</div>';
  html+='</div>';
  el.innerHTML=html;
}
function updateHalfFull(homeFixtures,awayFixtures,homeId,awayId){
  let el=document.getElementById('half_full');
  if(!el){return;}
  function calcHalf(fixtures,teamId){
    if(!fixtures||fixtures.length===0||!teamId)return null;
    let hw=0,hd=0,hl=0,ft=0;
    fixtures.forEach(function(f){
      if(!f.score||!f.score.halfTime)return;
      let isHome=f.homeTeam.id===teamId;
      let hhg=f.score.halfTime.home||0,ahg=f.score.halfTime.away||0;
      ft++;
      if(hhg===ahg)hd++;
      else if((isHome&&hhg>ahg)||(!isHome&&ahg>hhg))hw++;
      else hl++;
    });
    return ft>0?{hw:hw,hd:hd,hl:hl,ft:ft}:null;
  }
  let h=calcHalf(homeFixtures,homeId);
  let a=calcHalf(awayFixtures,awayId);

  let homeLeadProb=h?(h.hw/h.ft*100):35;
  let awayLeadProb=a?(a.hw/a.ft*100):30;
  let drawProb=100-homeLeadProb-awayLeadProb;
  let html='<div class="t" style="color:#6366f1">⏱️ 半全场预测 <span class="s2 g">(AI推演·基于历史半场数据)</span></div><div class="bg3 rd pd2 s1">';

  // 基于场均失球估算零封率（泊松分布近似：P(0)=e^-λ）
